openapi: 3.0.3
info:
  title: 텅장관리 앱 API
  version: 1.0.0
  description: |
    앱 화면(Android·웹, frontend/) ↔ 앱 서버(backend/) 계약. 이 파일이 정본이다. docs/API.md는 요약과 동작 설명이다.
    - 백엔드 `contract.ContractTest`가 실제 응답을 이 스펙으로 검사한다(정의되지 않은 필드·상태 코드도 실패).
    - 프론트 타입은 `npm run gen:api`로 `frontend/src/service/api/schema.d.ts`에 만들고, 목 서버는 `npm run mock:api`.
    - 바꿀 때는 구현보다 먼저 이 파일을 고치는 PR(`spec-change` 라벨 + docs/CHANGELOG.md)을 올린다.
    - 금액은 원 단위 정수, 날짜는 YYYY-MM-DD, 시각은 +09:00이 붙은 ISO-8601이다. 계산 규칙은 docs/policies.md.
    - 웹 서버가 부르는 `/internal/v1/web-links/*`는 web-link-api.yaml에 따로 있다.
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: auth
  - name: budget
  - name: category
  - name: transaction
  - name: analysis
  - name: coin
  - name: outfit
  - name: referral
  - name: web-link
  - name: chat
  - name: scheduled-expense
  - name: health

paths:
  /auth/signup:
    post:
      tags: [auth]
      summary: 이메일 가입(기본 카테고리 자동 생성)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, agreeTerms, agreePrivacy]
              properties:
                email: { type: string, maxLength: 254 }
                password: { type: string, minLength: 8, maxLength: 64, description: '영문과 숫자를 모두 포함' }
                agreeTerms: { type: boolean, description: 'true여야 한다' }
                agreePrivacy: { type: boolean, description: 'true여야 한다' }
      responses:
        '201': { $ref: '#/components/responses/Auth' }
        '400': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /auth/login:
    post:
      tags: [auth]
      summary: 이메일 로그인
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Auth' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /auth/oauth/providers:
    get:
      tags: [auth]
      summary: 키가 설정된 소셜 로그인 공급자
      security: []
      responses:
        '200':
          description: 공급자 목록(모두 미설정이면 빈 배열)
          content:
            application/json:
              schema:
                type: object
                required: [providers]
                additionalProperties: false
                properties:
                  providers: { type: array, items: { type: string, enum: [kakao, google] } }
  /auth/oauth/{provider}/start:
    get:
      tags: [auth]
      summary: 공급자 로그인 화면으로 이동
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: redirectUri, in: query, required: false, schema: { type: string }, description: '허용 목록과 정확히 같아야 한다' }
        - { name: codeChallenge, in: query, required: false, schema: { type: string }, description: 'base64url(SHA-256(codeVerifier)), 43자' }
      responses:
        '302': { description: '공급자 로그인 화면 또는 redirectUri?error=failed|provider_unavailable' }
        '400': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /auth/oauth/{provider}/callback:
    get:
      tags: [auth]
      summary: 공급자가 돌려보내는 주소
      security: []
      parameters:
        - { name: provider, in: path, required: true, schema: { type: string } }
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
      responses:
        '302': { description: 'redirectUri?code=(2분, 한 번) 또는 ?error=cancelled|email_in_use|failed' }
        '400':
          description: 'state 없음·만료·재사용. 안내 문장 한 줄(HTML)'
          content:
            text/html:
              schema: { type: string }
  /auth/oauth/exchange:
    post:
      tags: [auth]
      summary: 일회용 코드 + verifier를 토큰으로 교환
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string }
                codeVerifier: { type: string }
      responses:
        '200': { $ref: '#/components/responses/Auth' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /auth/logout:
    post:
      tags: [auth]
      summary: 이 회원의 토큰을 모든 기기에서 폐기
      responses:
        '204': { description: 폐기함 }
        '401': { $ref: '#/components/responses/Error' }
  /me:
    get:
      tags: [auth]
      summary: 내 정보
      responses:
        '200':
          description: 내 정보
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Error' }
    delete:
      tags: [auth]
      summary: 계정과 모든 데이터를 즉시 삭제
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                password: { type: string, description: 'hasPassword=true면 필수' }
                confirm: { type: string, description: "hasPassword=false면 '탈퇴'" }
      responses:
        '204': { description: 삭제함 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /budget/settings:
    get:
      tags: [budget]
      summary: 초기 예산 설정
      responses:
        '200': { $ref: '#/components/responses/Settings' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [budget]
      summary: 초기 예산 설정 전체 교체(성공하면 user.onboarded=true)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SettingsRequest' }
      responses:
        '200': { $ref: '#/components/responses/Settings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /budget/settings/income:
    patch:
      tags: [budget]
      summary: 월 수입액·수입일만 변경(다른 예산 설정과 잔액 기준 시각 보존)
      description: 기존 값이 expected와 다르면 409 BUDGET_INCOME_CHANGED. 이미 요청 값이면 재시도 성공으로 처리한다. 초기 예산이 없으면 404 BUDGET_NOT_SET.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IncomeSettingsRequest' }
      responses:
        '200': { $ref: '#/components/responses/Settings' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /budget/today:
    get:
      tags: [budget]
      summary: 오늘·이번 주 쓸 수 있는 돈과 캐릭터 점수(docs/policies.md §1·§2·§4)
      responses:
        '200':
          description: 서버 계산 최종값
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Today' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /budget/day-weights:
    get:
      tags: [budget]
      summary: 요일별 비중과 고를 수 있는 프리셋(docs/policies.md §5). 내 기록 기준은 부를 때마다 어제까지 기록으로 다시 낸다
      responses:
        '200': { $ref: '#/components/responses/DayWeights' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    put:
      tags: [budget]
      summary: 요일별 비중 저장. 프리셋은 서버가 비중을 채우고 CUSTOM은 보낸 비중을 쓴다. 오늘 하루 예산부터 바뀐다
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DayWeightsRequest' }
      responses:
        '200': { $ref: '#/components/responses/DayWeights' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /budget/seed-money:
    get:
      tags: [budget]
      summary: 시드머니와 반영할 주기(docs/policies.md §3)
      responses:
        '200': { $ref: '#/components/responses/SeedMoney' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /budget/seed-money/entries:
    post:
      tags: [budget]
      summary: 반영할 주기를 시드머니로 반영(주기당 한 번)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cycleEnd, choice]
              properties:
                cycleEnd: { type: string, format: date, description: '지금 pending.cycleEnd와 같아야 한다' }
                choice: { $ref: '#/components/schemas/SeedChoice' }
                amount: { type: integer, format: int64, minimum: 0, description: 'MANUAL만. GOAL·ALL은 서버가 정함' }
      responses:
        '201': { $ref: '#/components/responses/SeedMoney' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /budget/seed-money/transfers:
    post:
      tags: [budget]
      summary: 지금 예산에서 시드머니로 바로 옮기기(아무 때나 여러 번, 남은 생활비까지)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, format: int64, minimum: 1, maximum: 999999999999, description: '옮길 금액. movable보다 크면 400' }
      responses:
        '201': { $ref: '#/components/responses/SeedMoney' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
  /budget/seed-money/base:
    put:
      tags: [budget]
      summary: 모아둔 돈(seedBase)만 고치기. 반영·옮긴 기록과 예산 계산은 그대로
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [base]
              properties:
                base: { type: integer, format: int64, minimum: 0, maximum: 999999999999 }
      responses:
        '200': { $ref: '#/components/responses/SeedMoney' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /budget/seed-money/total:
    put:
      tags: [budget]
      summary: 지금까지 모은 시드머니 총액 정정. 생활비 잔액·과거 기록은 유지
      description: '0원 이상 1조 미만. 현재 총액과의 차액을 ADJUSTMENT 기록으로 남긴다. 같은 총액으로 다시 저장하면 기록을 추가하지 않는다. 총액 계산과 정정은 회원별 잠금 안에서 수행한다.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [total]
              additionalProperties: false
              properties:
                total: { type: integer, format: int64, minimum: 0, maximum: 999999999999 }
      responses:
        '200': { $ref: '#/components/responses/SeedMoney' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /categories:
    get:
      tags: [category]
      summary: 카테고리 목록(사용자가 저장한 순서, 기본값은 생성 순)
      parameters:
        - { name: type, in: query, required: false, schema: { $ref: '#/components/schemas/TxType' } }
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Category' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [category]
      summary: 카테고리 추가
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, type]
              properties:
                name: { type: string, minLength: 1, maxLength: 20 }
                type: { $ref: '#/components/schemas/TxType' }
                color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$', description: '생략하면 #98A2B3' }
                icon: { type: string, pattern: '^[a-z0-9-]{1,40}$', description: 'Ionicons 이름. 생략하면 pricetag' }
      responses:
        '201': { $ref: '#/components/responses/Category' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /categories/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      tags: [category]
      summary: 이름·색·아이콘 변경(type은 못 바꿈)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, minLength: 1, maxLength: 20 }
                color: { type: string, pattern: '^#[0-9A-Fa-f]{6}$' }
                icon: { type: string, pattern: '^[a-z0-9-]{1,40}$' }
      responses:
        '200': { $ref: '#/components/responses/Category' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
    delete:
      tags: [category]
      summary: 기본·사용자 카테고리 삭제. 거래·예정 지출은 같은 종류의 다른 카테고리로 보존
      responses:
        '204': { description: 삭제함 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /categories/order:
    put:
      tags: [category]
      summary: 같은 종류의 카테고리 전체 순서 저장
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, ids]
              additionalProperties: false
              properties:
                type: { $ref: '#/components/schemas/TxType' }
                ids:
                  type: array
                  uniqueItems: true
                  items: { type: integer, format: int64 }
                  description: 본인 소유·같은 종류의 현재 카테고리 전체. 중복·누락·다른 회원 ID는 400
      responses:
        '200':
          description: 저장한 순서
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Category' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /scheduled-expenses:
    get:
      tags: [scheduled-expense]
      summary: 날짜별 예정 지출 조회(실제 거래·예산에는 반영하지 않음)
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: 예정일·ID 오름차순, 최대 366일
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/ScheduledExpense' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [scheduled-expense]
      summary: 미래 날짜의 예정 지출 등록. 실제 거래는 자동 생성하지 않음
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledExpenseInput' }
      responses:
        '201':
          description: 등록됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledExpense' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /scheduled-expenses/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [scheduled-expense]
      summary: 본인 예정 지출 수정. 날짜를 바꾸면 미래 날짜만 허용
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduledExpenseInput' }
      responses:
        '200':
          description: 수정됨
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduledExpense' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [scheduled-expense]
      summary: 본인 예정 지출 삭제
      responses:
        '204': { description: 삭제됨 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /transactions:
    get:
      tags: [transaction]
      summary: 기간 거래 목록(occurredAt 내림차순, 최대 366일). 먼저 날짜가 된 고정지출을 기록한다
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - { name: type, in: query, required: false, schema: { $ref: '#/components/schemas/TxType' } }
        - { name: categoryId, in: query, required: false, schema: { type: integer, format: int64 } }
      responses:
        '200':
          description: 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                additionalProperties: false
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Transaction' } }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [transaction]
      summary: 거래 기록. 같은 Idempotency-Key를 다시 보내면 처음 만든 거래를 200으로
      parameters:
        - { name: Idempotency-Key, in: header, required: false, description: "재전송 중복 방지 키. 64자 이하(넘으면 400 VALIDATION_FAILED)", schema: { type: string, maxLength: 64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [type, amount, categoryId, title]
              properties:
                type: { $ref: '#/components/schemas/TxType' }
                amount: { type: integer, format: int64, minimum: 1, maximum: 999999999999 }
                categoryId: { type: integer, format: int64, description: '본인 카테고리이고 type이 같아야 한다' }
                title: { type: string, minLength: 1, maxLength: 40 }
                memo: { type: string, maxLength: 200, nullable: true }
                occurredAt: { type: string, format: date-time, description: '생략하면 지금' }
      responses:
        '200': { $ref: '#/components/responses/Transaction' }
        '201': { $ref: '#/components/responses/Transaction' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /transactions/statement-import:
    post:
      tags: [transaction]
      summary: 거래내역서 PDF를 읽어 거래로 저장(policies §9). 신한은행 거래내역조회와 KB국민은행 계좌 거래내역 조회를 받는다
      description: |
        검토 없이 읽은 거래를 모두 저장한다. 단, 출금 뒤 31일 안에 같은 적요·내용·금액으로 들어온 입금(결제 취소)은 그 출금과 함께 저장하지 않고 건수에도 세지 않는다. 출금은 지출, 입금은 수입이고 카테고리는 내용으로 추정한다(못 맞추면 기타·기타 수입).
        이미 있는 같은 거래(종류·금액·시각·제목)는 건너뛰고(duplicates), 잔액 기준 시각(balanceAt, 예산 설정 전이면 지금) 이후 거래도 건너뛴다(afterBalance).
        한 줄이라도 읽지 못하거나 잔액이 이어지지 않으면 아무것도 저장하지 않고 400 STATEMENT_UNSUPPORTED.
        PDF와 비밀번호는 저장하지 않는다. 읽기는 30초·글자 200만 자까지이고 넘으면 400 STATEMENT_UNSUPPORTED.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'PDF, 10MB 이하·100쪽 이하' }
                password: { type: string, maxLength: 64, description: 'PDF 비밀번호. 없으면 생략' }
      responses:
        '200':
          description: 저장 결과
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StatementImport' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
  /transactions/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [transaction]
      summary: 거래 하나
      responses:
        '200': { $ref: '#/components/responses/Transaction' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    patch:
      tags: [transaction]
      summary: 보낸 필드만 수정. memo는 null이면 지움, 그 밖의 필드는 null이면 유지
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                type: { $ref: '#/components/schemas/TxType' }
                amount: { type: integer, format: int64, minimum: 1, maximum: 999999999999 }
                categoryId: { type: integer, format: int64 }
                title: { type: string, minLength: 1, maxLength: 40 }
                memo: { type: string, maxLength: 200, nullable: true }
                occurredAt: { type: string, format: date-time }
      responses:
        '200': { $ref: '#/components/responses/Transaction' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
    delete:
      tags: [transaction]
      summary: 거래 삭제
      responses:
        '204': { description: 삭제함 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /analysis/summary:
    get:
      tags: [analysis]
      summary: 기간별 카테고리(지출만)·일별 합계. 고정지출 자동 기록도 지출로 센다
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
      responses:
        '200':
          description: 합계
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AnalysisSummary' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /coins/check-in:
    post:
      tags: [coin]
      summary: 가입 선물·어제 예산 보너스·시간 적립 시작 처리(여러 번 불러도 안전)
      responses:
        '200':
          description: 지갑과 아직 보여 주지 않은 보상(오래된 순)
          content:
            application/json:
              schema:
                type: object
                required: [wallet, rewards]
                additionalProperties: false
                properties:
                  wallet: { $ref: '#/components/schemas/Wallet' }
                  rewards: { type: array, items: { $ref: '#/components/schemas/Reward' } }
        '401': { $ref: '#/components/responses/Error' }
  /coins/rewards/ack:
    post:
      tags: [coin]
      summary: 보상 모달을 보여 줬다고 표시(내 내역이 아닌 id는 무시)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: integer, format: int64 } }
      responses:
        '204': { description: 표시함 }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
  /coins:
    get:
      tags: [coin]
      summary: 지갑
      responses:
        '200': { $ref: '#/components/responses/Wallet' }
        '401': { $ref: '#/components/responses/Error' }
  /coins/collect:
    post:
      tags: [coin]
      summary: 쌓인 시간 적립 코인 모으기(받을 게 없으면 collected 0)
      responses:
        '200':
          description: 모은 개수와 지갑
          content:
            application/json:
              schema:
                type: object
                required: [collected, wallet]
                additionalProperties: false
                properties:
                  collected: { type: integer }
                  wallet: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Error' }
  /coins/attendance:
    get:
      tags: [coin]
      summary: 누적 출석 일수와 오늘 받을 보상
      responses:
        '200':
          description: 출석 현황
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attendance' }
        '401': { $ref: '#/components/responses/Error' }
    post:
      tags: [coin]
      summary: 오늘 출석(여러 번 불러도 한 번만 지급, 이미 했으면 rewarded 0)
      responses:
        '200':
          description: 받은 코인·코스튬, 출석 현황, 지갑
          content:
            application/json:
              schema:
                type: object
                required: [rewarded, outfitId, attendance, wallet]
                additionalProperties: false
                properties:
                  rewarded: { type: integer }
                  outfitId: { type: string, nullable: true, description: '이번 요청으로 받은 코스튬 id, 없으면 null' }
                  attendance: { $ref: '#/components/schemas/Attendance' }
                  wallet: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Error' }
  /coins/ad-bonus:
    post:
      tags: [coin]
      summary: 광고를 다 본 뒤 시청 시간 보너스(15~30초 +5, 30초 이상 +10)
      description: >-
        시간은 앱이 잰 값을 믿는다. 오늘 받은 광고 보상(SSV 콜백) 수보다 보너스를 더 받을 수 없어서, 콜백이 아직 안 왔으면
        409 AD_NOT_REWARDED이고 앱이 잠시 뒤 다시 부른다. 같은 requestId는 한 번만 지급하고 다시 불러도 같은 결과를 준다.
        15초 미만은 보너스 0(기록하지 않음)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId, watchedSeconds]
              additionalProperties: false
              properties:
                requestId: { type: string, pattern: '^[A-Za-z0-9-]{8,40}$', description: '앱이 광고마다 새로 만든 값' }
                watchedSeconds: { type: integer, minimum: 0, maximum: 3600, description: '광고가 열린 뒤 닫힐 때까지 초(앱이 잼)' }
      responses:
        '200':
          description: 이번 광고로 받은 코인과 지갑
          content:
            application/json:
              schema:
                type: object
                required: [reward, bonus, total, wallet]
                additionalProperties: false
                properties:
                  reward: { type: integer, description: '광고 기본 코인(10, SSV 콜백이 지급)' }
                  bonus: { type: integer, description: '시청 시간 보너스 0·5·10' }
                  total: { type: integer, description: 'reward + bonus(10·15·20)' }
                  wallet: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /coins/ledger:
    get:
      tags: [coin]
      summary: 코인 적립·사용 내역, 최신순. before로 이전 내역을 더 불러온다
      parameters:
        - { name: before, in: query, required: false, description: '이 id보다 오래된 내역(앞 응답의 nextBefore)', schema: { type: integer, format: int64 } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
      responses:
        '200':
          description: 내역 한 쪽
          content:
            application/json:
              schema:
                type: object
                required: [items, nextBefore]
                additionalProperties: false
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/LedgerEntry' } }
                  nextBefore: { type: integer, format: int64, nullable: true, description: '다음 요청의 before. null이면 끝' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }

  /outfits:
    get:
      tags: [outfit]
      summary: 코스튬 목록(레벨 코스튬 먼저, 상점 상품 뒤)
      responses:
        '200': { $ref: '#/components/responses/OutfitList' }
        '401': { $ref: '#/components/responses/Error' }
  /outfits/{id}/purchase:
    post:
      tags: [outfit]
      summary: 코인으로 상점 코스튬 구매(바로 적용하지 않음)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { $ref: '#/components/responses/OutfitList' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
  /outfits/equipped:
    put:
      tags: [outfit]
      summary: 코스튬 적용(null이면 기본 캐릭터)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                outfitId: { type: string, nullable: true }
      responses:
        '200': { $ref: '#/components/responses/OutfitList' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /referrals/me:
    get:
      tags: [referral]
      summary: 내 추천 코드(처음 부를 때 만든다)
      responses:
        '200':
          description: 내 추천 코드
          content:
            application/json:
              schema:
                type: object
                required: [code, invitedCount, registered, rewardAmount]
                additionalProperties: false
                properties:
                  code: { type: string, description: '영문 대문자·숫자 8자' }
                  invitedCount: { type: integer, format: int64 }
                  registered: { type: boolean, description: '내가 다른 사람 코드를 등록했는지' }
                  rewardAmount: { type: integer }
        '401': { $ref: '#/components/responses/Error' }
  /referrals:
    post:
      tags: [referral]
      summary: 다른 사람 추천 코드 등록(양쪽 코인, 한 번만)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                code: { type: string, description: '대소문자·앞뒤 공백 무시' }
      responses:
        '200':
          description: 받은 코인과 지갑
          content:
            application/json:
              schema:
                type: object
                required: [amount, wallet]
                additionalProperties: false
                properties:
                  amount: { type: integer }
                  wallet: { $ref: '#/components/schemas/Wallet' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }

  /me/web-link-codes:
    post:
      tags: [web-link]
      summary: 웹 연동 코드 발급(6자리, 10분, 한 번만. 새로 받으면 이전 코드 무효)
      responses:
        '201':
          description: 연동 코드
          content:
            application/json:
              schema:
                type: object
                required: [code, expiresAt]
                additionalProperties: false
                properties:
                  code: { type: string, pattern: '^[A-Z2-9]{6}$' }
                  expiresAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
  /me/web-links:
    get:
      tags: [web-link]
      summary: 내 웹 연동 목록(최신순)
      responses:
        '200':
          description: 연동 목록
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [id, createdAt]
                  additionalProperties: false
                  properties:
                    id: { type: integer, format: int64 }
                    createdAt: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Error' }
  /me/web-links/{id}:
    delete:
      tags: [web-link]
      summary: 웹 연동 해제
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '204': { description: 해제함 }
        '401': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /chat/messages:
    post:
      tags: [chat]
      summary: AI 메이트(Gemini) 답변. 대화는 서버에 저장하지 않고 앱이 보낸 기록으로만 답한다
      description: |
        서버가 오늘 예산·요일별 배분·이번 주기와 직전 같은 기간의 카테고리별 지출 합계(입력한 잔액·기록 기준)를 함께 보낸다. 거래 메모·개별 거래는 보내지 않는다.
        `action`은 제안일 뿐 저장하지 않는다. 사용자가 확인하면 앱이 `PUT /budget/day-weights`로 저장한다.
        서버에 키가 없으면 503 `CHAT_UNAVAILABLE`, 모델 호출이 실패하면 502 `CHAT_FAILED`, 1시간에 30번을 넘으면 429 `TOO_MANY_ATTEMPTS`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChatRequest' }
      responses:
        '200':
          description: 답변과 (있으면) 확인이 필요한 변경 제안
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ChatResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/Error' }
        '502': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }

  /ads/reward-callback:
    get:
      tags: [coin]
      summary: AdMob 보상형 광고 서버 검증(SSV) 콜백. 앱이 부르지 않고 구글 서버가 부른다
      description: 서명이 맞으면 user_id에게 10코인(하루 3회, transaction_id당 한 번)을 준다. 이미 줬거나 한도를 넘어도 200
      security: []
      parameters:
        - { name: transaction_id, in: query, required: true, schema: { type: string } }
        - { name: user_id, in: query, required: true, schema: { type: string } }
        - { name: signature, in: query, required: true, schema: { type: string } }
        - { name: key_id, in: query, required: true, schema: { type: string } }
      responses:
        '200': { description: 처리함(지급했거나 이미 줬거나 한도 초과) }
        '400': { description: user_id·transaction_id 형식 오류 }
        '403': { description: 서명이 맞지 않음 }

  /client-errors:
    post:
      tags: [health]
      summary: 앱이 겪은 오류 보고(오류 기록, 30일 보관)
      description: >-
        로그인 없이도 보낼 수 있고 토큰이 맞으면 회원 번호를 함께 남긴다. 같은 날 같은 오류는 한 줄로 묶는다.
        숫자(3자리 이상)·이메일은 서버가 가려 저장하고, 보낸 사람마다 10분에 30건까지만 저장한다(넘어도 204).
        앱은 결과를 기다리지 않는다. 거래 제목·메모·요청 본문은 보내지 않는다
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, message]
              additionalProperties: false
              properties:
                kind: { type: string, enum: [API, CRASH, JS], description: 'API 요청 실패, CRASH 화면 오류, JS 그 밖의 앱 오류' }
                message: { type: string, minLength: 1, maxLength: 2000 }
                stack: { type: string, maxLength: 8000 }
                screen: { type: string, maxLength: 100, description: '오류가 난 화면 경로' }
                method: { type: string, enum: [GET, POST, PUT, PATCH, DELETE] }
                path: { type: string, maxLength: 300, description: 'API 경로. 쿼리는 서버가 버리고 숫자 id는 {id}로 묶는다' }
                status: { type: integer, minimum: 0, maximum: 599 }
                code: { type: string, maxLength: 40, description: '서버 오류 code' }
                appVersion: { type: string, maxLength: 20 }
                updateId: { type: string, maxLength: 64, description: '원격 업데이트 id' }
                platform: { type: string, enum: [android, ios, web] }
      responses:
        '204': { description: 받음(한도를 넘어 버린 것 포함) }
        '400': { $ref: '#/components/responses/Error' }

  /health:
    get:
      tags: [health]
      summary: 서버가 떠 있는지
      security: []
      responses:
        '200':
          description: 정상
          content:
            application/json:
              schema:
                type: object
                required: [status]
                additionalProperties: false
                properties:
                  status: { type: string, enum: [UP] }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Error:
      description: '오류. 분기는 code로, message는 화면에 그대로 보여 줄 문장'
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Auth:
      description: 토큰(30일)과 계정
      content:
        application/json:
          schema: { $ref: '#/components/schemas/AuthResponse' }
    Settings:
      description: 초기 예산 설정
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Settings' }
    DayWeights:
      description: 요일별 비중
      content:
        application/json:
          schema: { $ref: '#/components/schemas/DayWeights' }
    SeedMoney:
      description: 시드머니
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SeedMoney' }
    Category:
      description: 카테고리
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Category' }
    Transaction:
      description: 거래
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Transaction' }
    Wallet:
      description: 코인 지갑
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Wallet' }
    OutfitList:
      description: 코스튬 목록
      content:
        application/json:
          schema: { $ref: '#/components/schemas/OutfitList' }

  schemas:
    Error:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          enum: [VALIDATION_FAILED, UNAUTHORIZED, INVALID_CREDENTIALS, SOCIAL_ACCOUNT, OAUTH_CODE_INVALID, NOT_FOUND,
            BUDGET_NOT_SET, BUDGET_INCOME_CHANGED, EMAIL_UNAVAILABLE, CATEGORY_DUPLICATE, CATEGORY_DEFAULT, SEED_NOT_PENDING,
            OUTFIT_NOT_FOR_SALE, OUTFIT_OWNED, OUTFIT_LOCKED, COINS_NOT_ENOUGH, REFERRAL_CODE_INVALID,
            REFERRAL_ALREADY, LINK_CODE_INVALID, LINK_NOT_FOUND, TOO_MANY_ATTEMPTS, AD_NOT_REWARDED, CHAT_UNAVAILABLE, CHAT_FAILED,
            STATEMENT_PASSWORD, STATEMENT_UNSUPPORTED, INTERNAL_ERROR]
        message: { type: string }
        fields:
          type: object
          description: VALIDATION_FAILED에서 필드별 문장
          additionalProperties: { type: string }
        retryAfterSeconds: { type: integer, format: int64, description: 'TOO_MANY_ATTEMPTS' }
        provider: { type: string, enum: [kakao, google], description: 'SOCIAL_ACCOUNT의 가입 공급자' }

    StatementImport:
      type: object
      required: [bank, from, to, imported, duplicates, afterBalance]
      additionalProperties: false
      properties:
        bank: { type: string, enum: [SHINHAN, KB], description: '읽은 거래내역서 형식: 신한은행 거래내역조회, KB국민은행 계좌 거래내역 조회' }
        from: { type: string, format: date, description: '거래내역서 조회기간 시작' }
        to: { type: string, format: date, description: '거래내역서 조회기간 끝' }
        imported: { type: integer, minimum: 0, description: '새로 저장한 거래 수' }
        duplicates: { type: integer, minimum: 0, description: '이미 있어서 건너뛴 거래 수' }
        afterBalance: { type: integer, minimum: 0, description: '잔액 기준 시각 이후라 건너뛴 거래 수' }

    TxType:
      type: string
      enum: [EXPENSE, INCOME]
    SeedChoice:
      type: string
      enum: [GOAL, ALL, MANUAL]
      description: 'GOAL 매달 저축할 돈, ALL 남은 돈 전부, MANUAL 직접 입력'
    SeedEntryChoice:
      type: string
      enum: [GOAL, ALL, MANUAL, EXTRA, ADJUSTMENT]
      description: '기록에 보이는 방법. GOAL·ALL·MANUAL은 수입일 전날 반영, EXTRA는 지금 예산에서 바로 옮김, ADJUSTMENT는 생활비를 바꾸지 않는 총액 정정(차액은 음수 가능)'

    User:
      type: object
      required: [id, email, onboarded, createdAt, provider, hasPassword]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        email: { type: string, nullable: true, description: '소셜 계정은 null일 수 있다' }
        onboarded: { type: boolean, description: 'false면 초기 예산 설정으로' }
        createdAt: { type: string, format: date-time }
        provider: { type: string, enum: [email, kakao, google] }
        hasPassword: { type: boolean }
    AuthResponse:
      type: object
      required: [accessToken, expiresAt, user]
      additionalProperties: false
      properties:
        accessToken: { type: string }
        expiresAt: { type: string, format: date-time }
        user: { $ref: '#/components/schemas/User' }

    FixedExpenseInput:
      type: object
      required: [name, amount, day]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        amount: { type: integer, format: int64, minimum: 1, maximum: 999999999999 }
        day: { type: integer, minimum: 1, maximum: 31, description: '31 = 말일' }
    SavingInput:
      type: object
      required: [name, amount]
      properties:
        name: { type: string, minLength: 1, maxLength: 40 }
        amount: { type: integer, format: int64, minimum: 1, maximum: 999999999999 }
    SettingsRequest:
      type: object
      required: [balance, payday, incomeAmount]
      properties:
        balance: { type: integer, format: int64, minimum: 0, maximum: 999999999999 }
        balanceAt: { type: string, format: date-time, description: '생략하면 서버 현재 시각. 5분 넘게 미래면 400' }
        payday: { type: integer, minimum: 1, maximum: 31, description: '31 = 말일' }
        incomeAmount: { type: integer, format: int64, minimum: 0, maximum: 999999999999 }
        cardUnpaid: { type: integer, format: int64, minimum: 0, maximum: 999999999999, description: '생략하면 0' }
        fixedExpenses: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/FixedExpenseInput' } }
        protectedItems: { type: array, maxItems: 30, items: { $ref: '#/components/schemas/SavingInput' }, description: '매달 저축할 돈' }
        seedBase: { type: integer, format: int64, minimum: 0, maximum: 999999999999, description: '모아둔 돈. 생략하면 저장된 값 유지' }
    Settings:
      type: object
      required: [balance, balanceAt, payday, incomeAmount, cardUnpaid, fixedExpenses, protectedItems, seedBase, updatedAt]
      additionalProperties: false
      properties:
        balance: { type: integer, format: int64 }
        balanceAt: { type: string, format: date-time }
        payday: { type: integer }
        incomeAmount: { type: integer, format: int64 }
        cardUnpaid: { type: integer, format: int64 }
        fixedExpenses:
          type: array
          items:
            type: object
            required: [id, name, amount, day]
            additionalProperties: false
            properties:
              id: { type: integer, format: int64, description: '저장할 때마다 바뀐다' }
              name: { type: string }
              amount: { type: integer, format: int64 }
              day: { type: integer }
        protectedItems:
          type: array
          items:
            type: object
            required: [id, name, amount]
            additionalProperties: false
            properties:
              id: { type: integer, format: int64, description: '저장할 때마다 바뀐다' }
              name: { type: string }
              amount: { type: integer, format: int64 }
        seedBase: { type: integer, format: int64 }
        updatedAt: { type: string, format: date-time }
    Today:
      type: object
      required: [date, nextPayday, daysLeft, estimatedBalance, reservedFixed, cardUnpaid, protectedTotal, remaining,
        todaySpent, dailyBudget, todayAvailable, shortage, weekSpent, weekDaysLeft, weekAvailable, cycleStart,
        hasTransactions, dayPreset, dayBudgets, reservedPlanned, dayPlans, characterPoints, characterDelta]
      additionalProperties: false
      properties:
        date: { type: string, format: date }
        nextPayday: { type: string, format: date }
        daysLeft: { type: integer, minimum: 1 }
        estimatedBalance: { type: integer, format: int64 }
        reservedFixed: { type: integer, format: int64 }
        cardUnpaid: { type: integer, format: int64 }
        protectedTotal: { type: integer, format: int64 }
        remaining: { type: integer, format: int64, description: '음수 가능' }
        todaySpent: { type: integer, format: int64 }
        dailyBudget: { type: integer, format: int64, minimum: 0 }
        todayAvailable: { type: integer, format: int64, description: '오늘 예산을 넘으면 음수' }
        shortage: { type: integer, format: int64, minimum: 0 }
        weekSpent: { type: integer, format: int64 }
        weekDaysLeft: { type: integer, minimum: 1 }
        weekAvailable: { type: integer, format: int64, minimum: 0 }
        cycleStart: { type: string, format: date }
        hasTransactions: { type: boolean }
        dayPreset: { $ref: '#/components/schemas/DayPreset' }
        dayBudgets:
          type: array
          description: '월~일 요일별 하루 예산(남은 생활비를 남은 날의 요일 비중 합으로 나눔, §5). dailyBudget = 오늘 요일 값'
          minItems: 7
          maxItems: 7
          items: { type: integer, format: int64, minimum: 0 }
        reservedPlanned: { type: integer, format: int64, minimum: 0, description: '내일~수입일 전날 예정 지출 합(남은 생활비에서 이미 뺐다, §2 예정 지출 반영)' }
        dayPlans:
          type: array
          description: '수입일 전날까지 예정 지출이 있는 날짜별 하루 예산(날짜 오름차순, 없으면 빈 배열). budget = 그 날짜 몫 + planned'
          items:
            type: object
            required: [date, planned, budget]
            additionalProperties: false
            properties:
              date: { type: string, format: date }
              planned: { type: integer, format: int64, minimum: 1 }
              budget: { type: integer, format: int64, minimum: 0 }
        characterPoints: { type: integer, minimum: 0, maximum: 500 }
        characterDelta: { type: integer }
      example:
        # docs/policies.md §2 예시 ①(목 서버 응답)
        date: '2026-10-13'
        nextPayday: '2026-10-26'
        daysLeft: 13
        estimatedBalance: 1268000
        reservedFixed: 450000
        cardUnpaid: 0
        protectedTotal: 300000
        remaining: 518000
        todaySpent: 70000
        dailyBudget: 45230
        todayAvailable: -24770
        shortage: 24770
        weekSpent: 70000
        weekDaysLeft: 6
        weekAvailable: 201380
        cycleStart: '2026-09-25'
        hasTransactions: true
        dayPreset: EVEN
        dayBudgets: [45230, 45230, 45230, 45230, 45230, 45230, 45230]
        reservedPlanned: 0
        dayPlans: []
        characterPoints: 130
        characterDelta: 15
    DayPreset:
      type: string
      enum: [EVEN, RECORD, WEEKEND, WEEKDAY, CUSTOM]
      description: 'EVEN 기본 배분, RECORD 내 기록 기준, WEEKEND 주말 넉넉히, WEEKDAY 평일 넉넉히, CUSTOM 직접 조정'
    DayWeightList:
      type: array
      description: '월~일 비중(상대값). 하루 예산 = 남은 생활비 × 그 요일 비중 ÷ 남은 날의 비중 합'
      minItems: 7
      maxItems: 7
      items: { type: integer, minimum: 5, maximum: 30 }
    DayWeightsRequest:
      type: object
      required: [preset]
      additionalProperties: false
      properties:
        preset: { $ref: '#/components/schemas/DayPreset' }
        weights:
          allOf: [{ $ref: '#/components/schemas/DayWeightList' }]
          description: 'CUSTOM이면 필수. 다른 프리셋이면 무시하고 서버가 채운다'
    DayWeights:
      type: object
      required: [preset, weights, min, max, presets, record]
      additionalProperties: false
      properties:
        preset: { $ref: '#/components/schemas/DayPreset' }
        weights: { $ref: '#/components/schemas/DayWeightList' }
        min: { type: integer, description: '요일 비중 최솟값(5)' }
        max: { type: integer, description: '요일 비중 최댓값(30)' }
        presets:
          type: array
          description: 'EVEN·RECORD·WEEKEND·WEEKDAY 순서'
          items:
            type: object
            required: [id, weights]
            additionalProperties: false
            properties:
              id: { $ref: '#/components/schemas/DayPreset' }
              weights:
                type: array
                nullable: true
                description: 'null이면 지금 쓸 수 없음(RECORD의 기록 부족)'
                minItems: 7
                maxItems: 7
                items: { type: integer, minimum: 5, maximum: 30 }
        record:
          type: object
          description: '내 기록 기준을 낸 기간(오늘 전 최대 3개월, 기간 안 첫 기록일 ~ 어제). days ≥ minDays이고 weekdays ≥ minWeekdays여야 쓸 수 있다'
          required: [from, to, days, weekdays, minDays, minWeekdays]
          additionalProperties: false
          properties:
            from: { type: string, format: date, nullable: true, description: '기간 안 기록이 없으면 null' }
            to: { type: string, format: date }
            days: { type: integer, minimum: 0, description: '지출을 기록한 날 수(고정지출 자동 기록 제외)' }
            weekdays: { type: integer, minimum: 0, maximum: 7, description: '기록이 있는 요일 수' }
            minDays: { type: integer }
            minWeekdays: { type: integer }
      example:
        preset: RECORD
        weights: [10, 10, 9, 9, 19, 29, 14]
        min: 5
        max: 30
        presets:
          - { id: EVEN, weights: [14, 14, 14, 14, 14, 14, 14] }
          - { id: RECORD, weights: [10, 10, 9, 9, 19, 29, 14] }
          - { id: WEEKEND, weights: [12, 12, 12, 12, 14, 19, 19] }
          - { id: WEEKDAY, weights: [16, 16, 16, 16, 16, 10, 10] }
        record: { from: '2026-09-29', to: '2026-10-26', days: 28, weekdays: 7, minDays: 7, minWeekdays: 3 }
    SeedMoney:
      type: object
      required: [base, saved, total, monthlyGoal, movable, pending, entries]
      additionalProperties: false
      properties:
        base: { type: integer, format: int64, description: '모아둔 돈(seedBase)' }
        saved: { type: integer, format: int64, description: '주기별 반영·바로 보내기·총액 정정 차액의 합. 정정으로 음수일 수 있으며 사용자 화면에는 total을 표시한다' }
        total: { type: integer, format: int64 }
        monthlyGoal: { type: integer, format: int64, description: '매달 저축할 돈 합' }
        movable: { type: integer, format: int64, description: '지금 예산에서 시드머니로 바로 보낼 수 있는 최대 금액(남은 생활비, 0 이상)' }
        pending:
          type: object
          nullable: true
          description: 반영할 주기. 없으면 null
          required: [cycleEnd, payday, goalAmount, allAmount]
          additionalProperties: false
          properties:
            cycleEnd: { type: string, format: date }
            payday: { type: string, format: date }
            goalAmount: { type: integer, format: int64 }
            allAmount: { type: integer, format: int64 }
        entries:
          type: array
          description: 최근 12개, 최신순
          items: { $ref: '#/components/schemas/SeedEntry' }
      example:
        # docs/policies.md §3 첫 행(목 서버 응답)
        base: 500000
        saved: 0
        total: 500000
        monthlyGoal: 300000
        movable: 1200000
        pending: { cycleEnd: '2026-10-25', payday: '2026-10-26', goalAmount: 300000, allAmount: 950000 }
        entries: []
    SeedEntry:
      type: object
      required: [cycleEnd, choice, amount, createdAt]
      additionalProperties: false
      properties:
        cycleEnd: { type: string, format: date, description: 'EXTRA는 옮긴 날짜, ADJUSTMENT는 총액 정정 날짜' }
        choice: { $ref: '#/components/schemas/SeedEntryChoice' }
        amount: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }

    Category:
      type: object
      required: [id, name, type, color, icon, isDefault]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        type: { $ref: '#/components/schemas/TxType' }
        color: { type: string, description: '#RRGGBB' }
        icon: { type: string, description: 'Ionicons 이름' }
        isDefault: { type: boolean }
    ScheduledExpenseInput:
      type: object
      required: [amount, categoryId, title, date]
      additionalProperties: false
      properties:
        amount: { type: integer, format: int64, minimum: 1, maximum: 999999999999 }
        categoryId: { type: integer, format: int64, description: 본인 소유 지출 카테고리 }
        title: { type: string, minLength: 1, maxLength: 40 }
        date: { type: string, format: date }
    ScheduledExpense:
      type: object
      required: [id, amount, categoryId, category, title, date, createdAt, updatedAt]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        amount: { type: integer, format: int64 }
        categoryId: { type: integer, format: int64 }
        category:
          type: object
          nullable: true
          required: [id, name, color, icon]
          additionalProperties: false
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            color: { type: string }
            icon: { type: string }
        title: { type: string }
        date: { type: string, format: date }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Transaction:
      type: object
      required: [id, type, amount, categoryId, category, title, memo, occurredAt, createdAt, fromFixed]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        type: { $ref: '#/components/schemas/TxType' }
        amount: { type: integer, format: int64, minimum: 1 }
        categoryId: { type: integer, format: int64 }
        category:
          type: object
          nullable: true
          required: [id, name, color, icon]
          additionalProperties: false
          properties:
            id: { type: integer, format: int64 }
            name: { type: string }
            color: { type: string }
            icon: { type: string }
        title: { type: string }
        memo: { type: string, nullable: true }
        occurredAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        fromFixed: { type: boolean, description: '고정지출 자동 기록' }
    AnalysisSummary:
      type: object
      required: [from, to, expenseTotal, incomeTotal, expenseCount, byCategory, daily]
      additionalProperties: false
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        expenseTotal: { type: integer, format: int64 }
        incomeTotal: { type: integer, format: int64 }
        expenseCount: { type: integer }
        byCategory:
          type: array
          description: 지출만, 금액 내림차순
          items:
            type: object
            required: [categoryId, name, color, icon, amount, count, ratio]
            additionalProperties: false
            properties:
              categoryId: { type: integer, format: int64 }
              name: { type: string }
              color: { type: string }
              icon: { type: string }
              amount: { type: integer, format: int64 }
              count: { type: integer }
              ratio: { type: number, description: '지출 합 대비, 소수 3자리' }
        daily:
          type: array
          description: from~to 모든 날짜(0 포함)
          items:
            type: object
            required: [date, expense, income]
            additionalProperties: false
            properties:
              date: { type: string, format: date }
              expense: { type: integer, format: int64 }
              income: { type: integer, format: int64 }

    IncomeSettingsRequest:
      type: object
      additionalProperties: false
      required: [incomeAmount, payday, expectedIncomeAmount, expectedPayday]
      properties:
        incomeAmount: { type: integer, format: int64, minimum: 0, maximum: 999999999999 }
        payday: { type: integer, minimum: 1, maximum: 31 }
        expectedIncomeAmount: { type: integer, format: int64, minimum: 0, maximum: 999999999999 }
        expectedPayday: { type: integer, minimum: 1, maximum: 31 }
    IncomeSettingsProposal:
      allOf:
        - $ref: '#/components/schemas/IncomeSettingsRequest'
    IncomeTransactionProposal:
      type: object
      additionalProperties: false
      required: [operation, transactionId, title, date, categoryId, category, amount, changes]
      properties:
        operation: { type: string, enum: [CREATE, UPDATE] }
        transactionId: { type: integer, format: int64, nullable: true }
        title: { type: string, minLength: 1, maxLength: 40 }
        date: { type: string, format: date }
        categoryId: { type: integer, format: int64 }
        category: { type: string }
        amount: { type: integer, format: int64, minimum: 1, maximum: 999999999999 }
        changes:
          type: array
          items: { type: string, enum: [AMOUNT, DATE, TITLE, CATEGORY] }
    ExpenseTransactionProposal:
      type: object
      additionalProperties: false
      required: [operation, transactionId, title, date, categoryId, category, amount, changes]
      properties:
        operation: { type: string, enum: [CREATE, UPDATE] }
        transactionId: { type: integer, format: int64, nullable: true }
        title: { type: string, minLength: 1, maxLength: 40 }
        date: { type: string, format: date }
        categoryId: { type: integer, format: int64 }
        category: { type: string }
        amount: { type: integer, format: int64, minimum: 1, maximum: 999999999999 }
        changes:
          type: array
          items: { type: string, enum: [AMOUNT, DATE, TITLE, CATEGORY] }
    ChatMessage:
      type: object
      required: [role, text]
      additionalProperties: false
      properties:
        role: { type: string, enum: [USER, MODEL], description: 'USER 사용자, MODEL 이전 AI 답변' }
        text: { type: string, minLength: 1, maxLength: 1000 }
    ChatRequest:
      type: object
      required: [messages]
      additionalProperties: false
      properties:
        messages:
          type: array
          description: '오래된 것부터. 마지막은 USER. 첫 USER 앞의 MODEL(인사말 등)은 서버가 건너뛴다'
          minItems: 1
          maxItems: 20
          items: { $ref: '#/components/schemas/ChatMessage' }
        mate:
          type: string
          enum: [ANALYST, FRIEND, COACH]
          description: '말투. ANALYST 똑똑한 분석가(기본), FRIEND 다정한 친구, COACH 따끔한 조언가'
        accepts:
          type: array
          description: '앱이 처리할 수 있는 제안 종류. SCHEDULE·INCOME·EXPENSE를 각각 알린 앱에만 일정·수입·지출 기록 제안을 보낸다(옛 앱 보호)'
          maxItems: 4
          items: { type: string, enum: [SCHEDULE, INCOME, EXPENSE] }
        pending:
          type: object
          nullable: true
          description: '직전에 제안한 일정. 사용자가 수정 의견을 줄 때 함께 보내면 서버가 이것을 바탕으로 다시 제안한다'
          required: [title, date, categoryId]
          additionalProperties: false
          properties:
            title: { type: string, minLength: 1, maxLength: 40 }
            date: { type: string, format: date }
            categoryId: { type: integer, format: int64 }
            amount: { type: integer, format: int64, nullable: true, minimum: 1, maximum: 999999999999 }
    ChatResponse:
      type: object
      required: [reply, action]
      additionalProperties: false
      properties:
        reply: { type: string, description: '화면에 보여 줄 답변. **굵게** 표시가 들어갈 수 있다' }
        action:
          type: object
          nullable: true
          description: |
            확인이 필요한 변경 제안. 없으면 null. 서버는 저장하지 않는다.
            INCOME_TRANSACTION: 확인하면 기존 POST /transactions 또는 PATCH /transactions/{id}로 저장한다. UPDATE는 changes에 있는 필드만 보낸다.
            INCOME_SETTINGS: 확인하면 PATCH /budget/settings/income으로 저장한다.
            EXPENSE_TRANSACTION: 확인하면 기존 POST /transactions(type EXPENSE) 또는 PATCH /transactions/{id}로 저장한다. UPDATE는 changes에 있는 필드만 보낸다.
            DAY_PRESET: 확인하면 앱이 PUT /budget/day-weights {preset}으로 저장한다.
            SCHEDULE: 확인하면 앱이 POST /scheduled-expenses {amount, categoryId, title, date}로 등록한 뒤 GET /budget/today를 다시 받는다.
          required: [type]
          additionalProperties: false
          properties:
            type: { type: string, enum: [DAY_PRESET, SCHEDULE, INCOME_TRANSACTION, INCOME_SETTINGS, EXPENSE_TRANSACTION] }
            preset:
              type: string
              enum: [EVEN, RECORD, WEEKEND, WEEKDAY]
              description: 'DAY_PRESET일 때만. CUSTOM은 제안하지 않는다. RECORD는 기록이 충분할 때만'
            label: { type: string, description: 'DAY_PRESET일 때만. 프리셋 이름(기본 배분·내 기록 기준·주말 넉넉히·평일 넉넉히)' }
            incomeTransaction: { $ref: '#/components/schemas/IncomeTransactionProposal' }
            incomeSettings: { $ref: '#/components/schemas/IncomeSettingsProposal' }
            expenseTransaction: { $ref: '#/components/schemas/ExpenseTransactionProposal' }
            schedule:
              type: object
              description: 'SCHEDULE일 때만'
              required: [title, date, categoryId, category, amount, basis, preview]
              additionalProperties: false
              properties:
                title: { type: string, minLength: 1, maxLength: 40 }
                date: { type: string, format: date, description: '내일 ~ 90일 뒤' }
                categoryId: { type: integer, format: int64 }
                category: { type: string }
                amount:
                  type: integer
                  format: int64
                  nullable: true
                  description: '서버가 거래 기록으로 예측한 금액(100원 단위 내림). 기록이 적어 예측하지 못하면 null이고 reply가 금액을 되묻는다. 사용자가 말한 금액이면 그 값'
                basis:
                  type: object
                  nullable: true
                  description: '예측 근거. 금액을 사용자가 말했거나 예측하지 못했으면 null'
                  required: [samples, scope, days]
                  additionalProperties: false
                  properties:
                    samples: { type: integer, minimum: 3 }
                    scope: { type: string, enum: [SLOT, CATEGORY], description: 'CATEGORY 카테고리 하루 합계 기준(samples는 기록 있는 날 수). SLOT은 11-06까지의 시간대 기준으로 지금은 오지 않는다' }
                    days: { type: integer }
                preview:
                  type: object
                  nullable: true
                  description: '이 금액으로 등록했을 때 서버가 가정 계산한 예산. amount가 null이거나 날짜가 다음 수입일 이후라 이번 예산에 들어가지 않으면 null. 이미 같은 날짜 예정이 있으면 합산'
                  required: [dayBudget, dailyBudgetBefore, dailyBudgetAfter]
                  additionalProperties: false
                  properties:
                    dayBudget: { type: integer, format: int64, minimum: 0, description: '등록 후 그 날짜의 하루 예산' }
                    dailyBudgetBefore: { type: integer, format: int64, minimum: 0, description: '지금 오늘 하루 예산' }
                    dailyBudgetAfter: { type: integer, format: int64, minimum: 0, description: '등록 후 오늘 하루 예산' }
      example:
        reply: "요일별 배분을 **주말 넉넉히**로 바꿀까요?\n확인을 누르면 오늘 하루 예산부터 바뀌어요."
        action: { type: DAY_PRESET, preset: WEEKEND, label: 주말 넉넉히 }

    Wallet:
      type: object
      required: [balance, passive, ad, equippedOutfitId]
      additionalProperties: false
      properties:
        balance: { type: integer, format: int64 }
        ad:
          type: object
          description: '보상형 광고(상점 [광고 보기]). 보상은 AdMob 서버 검증 콜백이 지급하므로 앱은 광고를 본 뒤 이 값을 다시 읽는다'
          required: [rewardedToday, dailyLimit, reward]
          additionalProperties: false
          properties:
            rewardedToday: { type: integer, description: '오늘 받은 횟수(KST)' }
            dailyLimit: { type: integer, description: '하루 한도(3)' }
            reward: { type: integer, description: '1회 기본 코인(10). 시청 시간 보너스는 POST /coins/ad-bonus' }
        passive:
          type: object
          required: [collectable, collectedToday, dailyLimit, nextAt]
          additionalProperties: false
          properties:
            collectable: { type: integer }
            collectedToday: { type: integer }
            dailyLimit: { type: integer }
            nextAt: { type: string, format: date-time, nullable: true }
        equippedOutfitId: { type: string, nullable: true, description: 'null이면 기본 캐릭터(costume-lv1)' }
    Reward:
      type: object
      required: [id, reason, amount, refDate, createdAt]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        reason: { type: string, enum: [SIGNUP_GIFT, BUDGET_BONUS, PASSIVE, REFERRAL_INVITEE, REFERRAL_INVITER, PURCHASE, REFUND, ATTENDANCE, AD_REWARD, AD_BONUS] }
        amount: { type: integer }
        refDate: { type: string, format: date, nullable: true, description: 'BUDGET_BONUS의 지킨 날짜' }
        createdAt: { type: string, format: date-time }
    LedgerEntry:
      type: object
      required: [id, reason, amount, refDate, outfitId, createdAt]
      additionalProperties: false
      properties:
        id: { type: integer, format: int64 }
        reason: { type: string, enum: [SIGNUP_GIFT, BUDGET_BONUS, PASSIVE, REFERRAL_INVITEE, REFERRAL_INVITER, PURCHASE, REFUND, ATTENDANCE, AD_REWARD, AD_BONUS] }
        amount: { type: integer, description: '적립은 양수, 사용(PURCHASE)은 음수' }
        refDate: { type: string, format: date, nullable: true, description: 'BUDGET_BONUS의 지킨 날짜' }
        outfitId: { type: string, nullable: true, description: 'PURCHASE의 코스튬 id' }
        createdAt: { type: string, format: date-time }
    Attendance:
      type: object
      required: [today, total, checkedToday, todayReward, todayOutfitId]
      additionalProperties: false
      properties:
        today: { type: string, format: date, description: '서버 기준 오늘(KST)' }
        total: { type: integer, description: '누적 출석 일수(오늘 했으면 오늘 포함). 빠진 날이 있어도 초기화하지 않는다' }
        checkedToday: { type: boolean }
        todayReward: { type: integer, description: '오늘 출석하면(했으면) 받는 코인. 7일 주기 5·5·10·5·5·5·30. 첫 7일째만 코인 0과 코스튬 보상' }
        todayOutfitId: { type: string, nullable: true, description: '오늘 출석하면(했으면) 받는 코스튬 id. 누적 7일째에 한 번만, 아니면 null' }
    OutfitList:
      type: object
      required: [balance, equippedOutfitId, peakLevel, items]
      additionalProperties: false
      properties:
        balance: { type: integer, format: int64 }
        equippedOutfitId: { type: string, nullable: true }
        peakLevel: { type: integer, minimum: 1, maximum: 6 }
        items:
          type: array
          items:
            type: object
            required: [id, name, price, unlockLevel, owned, equipped]
            additionalProperties: false
            properties:
              id: { type: string }
              name: { type: string }
              price: { type: integer, nullable: true, description: '레벨 코스튬은 null' }
              unlockLevel: { type: integer, nullable: true, description: '상점 상품은 null' }
              owned: { type: boolean }
              equipped: { type: boolean }
