spring:
  datasource:
    url: jdbc:h2:mem:test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

app:
  jwt:
    secret: test-secret-test-secret-test-secret-0123456789
    ttl-days: 30
  cors-origins: http://localhost:8081
  zone: Asia/Seoul
  outfits:
    show-inactive: true
  web-link:
    service-keys: old-test-service-key-0123456789abcdef,test-service-key-0123456789abcdef0123
  oauth:
    callback-base-url: http://localhost:8080
    allowed-redirect-uris: flexable://oauth/callback,http://localhost:8081/oauth/callback,https://example.com/callback?source=app
    kakao:
      client-id: ""
      client-secret: ""
      admin-key: ""
      scope: ""
    google:
      client-id: ""
      client-secret: ""
