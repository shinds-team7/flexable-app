# 로컬 개발용: MySQL 없이 H2 파일 DB로 실행 (./gradlew bootRun --args='--spring.profiles.active=local')
spring:
  datasource:
    url: jdbc:h2:file:./build/localdb/flexable;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
    username: sa
    password:

app:
  jwt:
    secret: local-dev-secret-local-dev-secret-0123456789
  cors-origins: http://localhost:8081,http://localhost:19006
  web-link:
    # 로컬 웹 백엔드(flexable-web)가 이 서버를 부를 때 쓰는 개발용 키
    service-keys: local-dev-service-key-local-dev-service-key
  outfits:
    # 애니메이션 파일 전이라 꺼 둔 상점 상품도 보여 준다(구매 흐름 시험용). 운영은 기본값 false
    show-inactive: true
