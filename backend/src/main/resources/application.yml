spring:
  application:
    name: flexable-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/flexable?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:flexable}
    password: ${DB_PASSWORD:flexable}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # 외부 감시(.github/workflows/server-health.yml)가 db·diskSpace 중 무엇이 DOWN인지 알 수 있게
      # 항목별 상태만 공개한다. 디스크 용량·DB 종류 같은 세부값(show-details)은 계속 숨긴다.
      show-components: always
  health:
    diskspace:
      # EC2 루트 디스크가 6.7GB라 가득 차기 전에 DOWN으로 알린다(이슈 #31). 기본값 10MB는 이미 늦다.
      threshold: 300MB

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-days: 30
  cors-origins: ${CORS_ORIGINS:http://localhost:8081}
  zone: Asia/Seoul
