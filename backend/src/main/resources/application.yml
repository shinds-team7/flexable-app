spring:
  application:
    name: flexable-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/flexable?serverTimezone=UTC&characterEncoding=UTF-8}
    username: ${DB_USERNAME:flexable}
    password: ${DB_PASSWORD:flexable}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # 외부 감시(.github/workflows/server-health.yml)가 db·diskSpace 중 무엇이 DOWN인지 알 수 있게
      # 항목별 상태만 공개한다. 디스크 용량·DB 종류 같은 세부값(show-details)은 계속 숨긴다.
      show-components: always
  health:
    diskspace:
      # EC2 루트 디스크가 작아서(이슈 #31 당시 6.7GB, 10-20 기준 15GB) 가득 차기 전에 DOWN으로 알린다. 기본값 10MB는 이미 늦다.
      threshold: 300MB

app:
  jwt:
    secret: ${JWT_SECRET:}
    ttl-days: 30
  cors-origins: ${CORS_ORIGINS:http://localhost:8081}
  zone: Asia/Seoul
  web-link:
    # 웹 서버(flexable-web)가 /internal/** 을 부를 때 쓰는 키. 쉼표 구분(교체 중 두 개), 32자 이상. 비우면 internal API는 401
    service-keys: ${WEB_LINK_SERVICE_KEYS:}
  oauth:
    callback-base-url: ${OAUTH_CALLBACK_BASE_URL:http://localhost:8080}
    allowed-redirect-uris: ${OAUTH_ALLOWED_REDIRECT_URIS:flexable://oauth/callback,http://localhost:8081/oauth/callback}
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      admin-key: ${KAKAO_ADMIN_KEY:}
      scope: ${KAKAO_SCOPE:}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
  chat:
    # AI 메이트(POST /chat/messages). 비우면 503 CHAT_UNAVAILABLE. 키는 .env에만 둔다(공개 저장소)
    gemini-api-key: ${GEMINI_API_KEY:}
    gemini-model: ${GEMINI_MODEL:gemini-2.5-flash}
