name: "✨ 작업"
description: "AI·사람에게 맡길 작업 하나(기능·수정·문서). 작게 나눌수록 좋아요"
body:
  - type: textarea
    attributes:
      label: 🎯 목표
      description: 이 작업이 끝나면 사용자나 팀이 무엇을 할 수 있게 되는지 한두 문장으로 적어 주세요.
      placeholder: 예) 수입일 전날 반영한 시드머니가 홈 카드에 바로 보인다
    validations:
      required: true
  - type: textarea
    attributes:
      label: 📚 참고 자료
      description: AI가 직접 읽을 저장소 문서와 절·계약을 적어 주세요. 채팅에 붙여 넣은 기획 대신 저장소 경로를 적습니다.
      placeholder: |
        - docs/FEATURES.md "시드머니·수입일 전날 반영" 행
        - docs/API.md "시드머니"의 POST /budget/seed-money/entries
    validations:
      required: true
  - type: textarea
    attributes:
      label: 📦 범위
      description: 할 일과 하지 않을 일을 적어 주세요. 같은 파일을 다른 사람과 동시에 고치게 되면 더 잘게 나눠 주세요.
      placeholder: |
        - 할 일: 반영 API, 홈 시드머니 카드 연결, 관련 테스트
        - 하지 않을 일: 웹 연동 응답 변경
    validations:
      required: true
  - type: textarea
    attributes:
      label: ✅ 완료 조건
      description: 사람과 AI가 같은 기준으로 끝났다고 판단할 수 있게, 가능하면 "어떤 테스트 통과"로 적어 주세요.
      placeholder: |
        - [ ] SeedMoneyFlowTest 통과(같은 주기 두 번 반영하면 409 SEED_NOT_PENDING)
        - [ ] npx tsc --noEmit · npx expo lint · npm run test:unit 통과
    validations:
      required: true
